<!-- ads.villagebaby.kr → villagebaby.kr/ads-marketing/ 로 넘겨주는 페이지.
     이 페이지 자체는 검색 결과에 나오지 않게 하고, 정식 주소는 canonical 로 알린다. -->
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://villagebaby.kr/ads-marketing/">
<script>
/* 광고·메일 링크에 붙은 ?utm_… 과 #위치 를 그대로 들고 넘어간다 */
location.replace('https://villagebaby.kr/ads-marketing/' + location.search + location.hash);
</script>
<!-- 스크립트가 꺼져 있어도 넘어가도록 -->
<meta http-equiv="refresh" content="0; url=https://villagebaby.kr/ads-marketing/">

</style>
</head>
<body>
<p>베이비빌리 광고 안내 페이지로 이동합니다. 넘어가지 않으면 <a href="https://villagebaby.kr/ads-marketing/">여기</a>를 눌러 주세요.</p>
